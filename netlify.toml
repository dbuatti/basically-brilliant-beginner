[build]
  publish = "."
  command = ""

# Netlify Function — issues the Jitsi JWT for the Council Console
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/jitsi-token"
  to = "/.netlify/functions/jitsi-token"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Only the features Chrome recognises. Listing unsupported ones
    # (attribution-reporting, private-aggregation, join-ad-interest-group,
    # run-ad-auction) makes the console noisy for no benefit.
    # The Council Console embeds the meeting server in an iframe. The
    # browser applies this header to that iframe, so the meeting origin
    # has to be allowed or it gets no microphone and no camera.
    #
    # The wildcard covers a quick tunnel, whose host name changes every
    # time it restarts. The explicit host is there for a named tunnel.
    Permissions-Policy = "camera=(self \"https://*.trycloudflare.com\" \"https://meet.charmingdivinations.com\"), microphone=(self \"https://*.trycloudflare.com\" \"https://meet.charmingdivinations.com\"), display-capture=(self \"https://*.trycloudflare.com\" \"https://meet.charmingdivinations.com\"), geolocation=()"
