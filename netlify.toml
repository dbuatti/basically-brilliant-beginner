[build]
  publish = "."
  command = ""

# Netlify Function — issues the Jitsi JWT for the Council Console
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/jitsi-token"
  to = "/.netlify/functions/jitsi-token"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Only the features Chrome recognises. Listing unsupported ones
    # (attribution-reporting, private-aggregation, join-ad-interest-group,
    # run-ad-auction) makes the console noisy for no benefit.
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=()"
